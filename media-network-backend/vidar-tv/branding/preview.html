<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#111216;font-family:Inter;color:#E4E6EE;display:flex;gap:60px;align-items:center;justify-content:center;height:100vh}
.tile{width:360px;height:360px;border-radius:72px;background:radial-gradient(circle at 50% 40%,#262a66,#111216 70%);display:grid;place-items:center;box-shadow:0 0 0 3px #5E66BC}
.bar{display:flex;align-items:center;gap:22px;font-size:54px;letter-spacing:.3em;color:#8E96E0}
.small{font-size:16px;letter-spacing:.2em;color:#BFC4D4;text-align:center;margin-top:16px}</style></head><body>
<div><div class="tile"><img src="vidar-emblem.svg" width="300"></div><div class="small">APP ICON</div></div>
<div><div class="bar"><img src="vidar-emblem.svg" width="110">VIDAR</div><div class="small">TOP-BAR WORDMARK</div></div>
</body></html>
